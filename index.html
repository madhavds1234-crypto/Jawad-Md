<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jawad MD Bot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0b0b;
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 35px 25px;
      text-align: center;
      border-radius: 22px;
      background: #151515;
      box-shadow: 0 0 30px rgba(0, 255, 150, 0.15);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 28px;
    }

    .command {
      background: #080808;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 18px;
      margin: 15px 0;
      text-align: left;
    }

    code {
      color: #00ff99;
      font-size: 18px;
    }

    .description {
      color: #aaa;
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    footer {
      margin-top: 25px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>🤖 Jawad MD Bot</h1>

    <p class="subtitle">
      WhatsApp Bot Commands
    </p>

    <div class="command">
      <code>!antilink on</code>
      <p class="description">
        Enable Anti-Link protection in the group.
      </p>
    </div>

    <div class="command">
      <code>!antilink off</code>
      <p class="description">
        Disable Anti-Link protection.
      </p>
    </div>

    <footer>
      ©️ 2026 Jawad MD Bot
    </footer>
  </div>

</body>
</html>
